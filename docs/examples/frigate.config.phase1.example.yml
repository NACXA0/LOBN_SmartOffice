# 阶段①示例：复制到 HAOS Frigate 的 config.yml 后改账号/IP/坐标
# 验收：MQTT 上可见 frigate/events。勿在此写开门业务规则。
# 全文步骤：docs/阶段1-HAOS底座验收.md

mqtt:
  host: core-mosquitto
  user: CHANGE_ME
  password: CHANGE_ME

go2rtc:
  streams:
    front_desk:
      - rtsp://user:pass@192.168.1.100:554/Streaming/Channels/101

cameras:
  front_desk:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_desk
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      retain:
        days: 30
        mode: motion
    zones:
      front_desk_zone:
        coordinates: 0.1,0.1,0.9,0.1,0.9,0.9,0.1,0.9

detectors:
  coral:
    type: edgetpu
    device: usb

objects:
  track:
    - person

# 阶段①即可关掉；刷脸阶段也必须保持关闭（身份在 SmartCenter Add-on）
face_recognition:
  enabled: false

version: 0.16-0

